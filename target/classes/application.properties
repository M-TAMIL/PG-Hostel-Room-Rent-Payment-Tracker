# ===================================================================
# RentEasy Application Configuration
# Connected to MySQL Database
# ===================================================================
spring.application.name=RentEasy-PG-Hostel-Tracker
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:renteasy_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tamil2008}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA / Hibernate Configuration for MySQL
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Allow data initialization with CommandLineRunner
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
